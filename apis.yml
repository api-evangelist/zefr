name: Zefr
description: >-
  Zefr is an ad-tech content intelligence company that classifies social video, image, audio
  and text so advertisers can buy and measure media against brand safety and suitability
  standards. Its classification engine labels content across YouTube, Meta (Facebook and
  Instagram), TikTok, Snapchat, Google Ads and DV360 against the 4A's and GARM frameworks,
  and its Brand Suitability Suite gives brands pre-bid controls and post-bid measurement from
  a single console. Zefr has no public developer program: production API infrastructure exists
  (api.zefr.com is a Google Apigee gateway, alongside api2.zefr.com and api-eu1.zefr.com) but
  no developer portal, API reference or machine-readable contract is published anywhere, and
  access runs through a demo request. The only machine-readable documents Zefr serves publicly
  are the OpenID Connect and OAuth 2.0 Authorization Server Metadata discovery documents on
  its Auth0 custom domain, login.zefr.com.
